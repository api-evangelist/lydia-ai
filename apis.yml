name: Lydia AI
description: 'Lydia AI is an enterprise AI company whose flagship platform, ORCA,
  reasons through complex operational problems and delivers structured work product
  rather than chat replies. ORCA spans three domains: Content & Commerce (generating
  product content, campaign assets, and structured search data), Evidence & Analysis
  (analyzing large document sets for legal discovery), and Operations & Logistics
  (optimizing routing, dispatch, and disruption response). The company is a portfolio
  company of 500 Global. As of this enrichment pass Lydia AI exposes no public
  developer portal, API reference, or machine-readable API surface; engagement is via
  a book-a-demo/contact sales motion.'
